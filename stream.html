<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color and Depth Streams</title>
    <style>
      #largeView {
        display: none;
        text-align: center;
      }
      #mainMenu {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="mainMenu">
      <input type="text" id="ip" value="car2.local" />
      <button onclick="connectWebSocket()">Connect</button>
      <button onclick="showLargeView()">Show Large Camera View</button>

      <div>
        <h2>Stream A</h2>
        <select name="streamAselect" id="select-a" onchange="selectStream()">
          <option value="">--</option>
        </select>
        <br />
        <img id="colorStream" src="" alt="Color Stream" style="border: 2px solid red" />
      </div>
      <div>
        <h2>Stream B</h2>
        <select name="streamBselect" id="select-b" onchange="selectStream()">
          <option value="">--</option>
        </select>
        <br />
        <img id="depthStream" src="" alt="Depth Stream" style="border: 2px solid red" />
      </div>
    </div>

    <div id="largeView">
      <button onclick="showMainMenu()">Back to Menu</button>
      <h2>Large Camera View</h2>
      <select name="streamCselect" id="select-c" onchange="selectStream()">
        <option value="">--</option>
      </select>
      <br />
      <br />
      <img
        id="largeCameraView"
        src=""
        alt="Large Camera View"
        style="border: 2px solid black; cursor: crosshair;"
        onclick="getColorValues(event)"
      />
      <p id="colorValues">Click on the image to see RGB values.</p>
    </div>

    <script>
      let ip_input = document.getElementById("ip");
      let selectA = document.getElementById("select-a");
      let selectB = document.getElementById("select-b");
      let selectC = document.getElementById("select-c");
      var ws;

      var availableStreams = [];

      // Function to connect to the WebSocket server
      function connectWebSocket() {
        ws = new WebSocket(`ws://${ip_input.value}:8765`);
        // Event handler for receiving messages from the server
        ws.onmessage = function (event) {
          let data = JSON.parse(event.data);
          if (data.a) {
            var imageSrc = "data:image/jpeg;base64," + data.a;
            document.getElementById("colorStream").src = imageSrc;
            
          }

          if (data.b) {
            var imageSrc = "data:image/jpeg;base64," + data.b;
            document.getElementById("depthStream").src = imageSrc;
            
          }
          if (data.c) {
            var imageSrc = "data:image/jpeg;base64," + data.c;
            document.getElementById("largeCameraView").src = imageSrc;         
            
          }
          if (data.streams) {
            console.log(data.streams);
            availableStreams = data.streams;
            buildSelects();
          }
        };
        // Event handler for when the WebSocket connection closes
        ws.onclose = function () {
          console.log("WebSocket connection closed");
        };
      }

      function buildSelects() {
        selectA.innerHTML = "";
        selectB.innerHTML = "";
        selectC.innerHTML = "";
        availableStreams.forEach((stream) => {
          let option = document.createElement("option");
          option.value = stream;
          option.text = stream;
          selectA.appendChild(option);

          let option2 = document.createElement("option");
          option2.value = stream;
          option2.text = stream;
          selectB.appendChild(option2);

          let option3 = document.createElement("option");
          option3.value = stream;
          option3.text = stream;
          selectC.appendChild(option3);

        });
      }

      function selectStream() {
        ws.send(JSON.stringify({
            streamA: selectA.value,
            streamB: selectB.value,
            streamC: selectC.value
        }));

       
      }

      function showLargeView() {
        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("largeView").style.display = "block";

        // Wähle standardmäßig den ersten Stream in select-c aus
        const selectC = document.getElementById("select-c");
        if (selectC.options.length > 0) {
            selectC.selectedIndex = 5; // Wähle den ersten Eintrag aus
            const selectedStream = selectC.value;

            // Sende den ausgewählten Stream an den WebSocket-Server
            if (selectedStream) {
                ws.send(JSON.stringify({ streamC: selectedStream }));
            }
        }
      }

      function showMainMenu() {
        document.getElementById("largeView").style.display = "none";
        document.getElementById("mainMenu").style.display = "block";
      }

      function getColorValues(event) {
        const img = document.getElementById("largeCameraView");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0, img.width, img.height);

        const rect = img.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const rgb = `[${pixel[0]}, ${pixel[1]}, ${pixel[2]}]`;
        const colorInput = document.createElement("input");
        colorInput.type = "text";
        colorInput.value = rgb;
        document.getElementById("colorValues").innerHTML = "RGB Werte: ";
        document.getElementById("colorValues").appendChild(colorInput);
      }

      window.onload = function () {
        connectWebSocket();
      };
    </script>
  </body>
</html>
