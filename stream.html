<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color and Depth Streams</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: linear-gradient(100deg, #ebcf74, #b67a02);
      background-size: cover;
      background-attachment: fixed;
      /* Fixes the background while scrolling */
      margin: 0;
      padding: 0;
      color: #212529;
      box-sizing: border-box;
      /* Ensures padding and border are included in the width */
    }

    h2 {
      color: #444;
      text-align: center;
    }

    #mainMenu,
    #colorAdjust {
      width: clamp(100px, 80vw, 1000px);
      /* Takes up 80% of the screen width */
      /* Limits the maximum width */
      margin: 20px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    #mainMenu input[type="text"] {
      width: calc(100% - 140px);
      padding: 10px;
      margin-right: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    #mainMenu button {
      padding: 10px 15px;
      border-radius: 4px;
      font-size: 14px;
      background: linear-gradient(135deg, #ffd000, #b86f02);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #mainMenu button:hover {
      background: linear-gradient(135deg, #b86f02, #603a01);
    }

    select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 10px auto;
      border: 2px solid #ddd;
      border-radius: 4px;
    }

    #colorValues {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    #hueValue {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    #grayValue {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    #colorAdjust button {
      display: block;
      margin: 10px auto;
      padding: 10px 15px;
      background: linear-gradient(135deg, #ffd000, #b86f02);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #colorAdjust button:hover,
    #fullscreenView button:hover {
      background: linear-gradient(135deg, #b86f02, #603a01);
    }

    #fullscreenView button {
      background: linear-gradient(135deg, #ffd000, #b86f02);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #logo {
      position: absolute;
      top: 10px;
      right: clamp(0px, 1vw, 60px);
      /* Ensures the center of the image is always at least 10px or 4% of the viewport width away from the right edge */
      width: clamp(0px, 6vw, 100px);
      /* Ensures the width is always 6% of the viewport width, but not larger than 100px */
      height: auto;
      border: none;
    }

    #fullscreenView {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      z-index: 2000;
      /* Ensures it is above other elements */
    }

    #fullscreenView img {
      width: 100%;
      object-fit: cover;
      /* Ensures the image fills the container while maintaining aspect ratio */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* Centers the image vertically and horizontally */
    }
  </style>
</head>

<body>
  <!-- Logo in the top-right corner -->
  <img id="logo" src="media/flawil_beavers_logo.png" alt="Flawil Beavers Logo" />

  <!-- Main Menu -->
  <div id="mainMenu">
    <h2><u><strong>Main Menu</strong></u></h2>

    <!-- Input field for WebSocket connection -->
    <input type="text" id="ip" value="car2.local" />
    <button id="connectBtn" onclick="connectWebSocket()">Connect</button>
    <button id="disconnectBtn" onclick="disconnectWebSocket()" style="display:none;">Disconnect</button>
    <p></p>
    <button onclick="showcolorAdjust()">Color Adjust</button>
    <button onclick="showFullscreen()">Fullscreen (Stream A)</button>

    <!-- Stream A -->
    <div>
      <h2>Stream A</h2>
      <select name="streamAselect" id="select-a" onchange="selectStream()">
        <option value="">--</option>
      </select>
      <img id="colorStream" src="" alt="Color Stream" />
    </div>

    <!-- Stream B -->
    <div>
      <h2>Stream B</h2>
      <select name="streamBselect" id="select-b" onchange="selectStream()">
        <option value="">--</option>
      </select>
      <img id="depthStream" src="" alt="Depth Stream" />
    </div>
  </div>

  <!-- Color Adjust View -->
  <div id="colorAdjust" style="display: none;">
    <button onclick="showMainMenu()">Back to Menu</button>
    <h2>Color Adjust</h2>
    <select name="streamCselect" id="select-c" onchange="selectStream()">
      <option value="">--</option>
    </select>
    <img
      id="colorAdjustView"
      src=""
      alt="Color Adjust"
      onclick="getColorValues(event); getgrayValue(event); getHSVValues(event);"
    />
    <p id="colorValues">Click on the image to see RGB values.</p>
    <p id="hueValue">Click on the image to see Hue value.</p>
    <p id="grayValue">Click on the image to see gray value.</p>
    <!-- Add a new paragraph to display Hue values -->

    <!-- Slider to adjust GRAY value -->
    <div id="graySliderContainer" style="text-align: center; margin-top: 20px;">
      <label for="graySlider">Adjust GRAY Value:</label>
      <input type="range" id="graySlider" min="0" max="255" value="110" style="width: 80%;"
        oninput="updateGrayValue(this.value)" />
      <p>Current GRAY Value: <span id="grayValueDisplay">110</span></p>
    </div>
  </div>

  <!-- Fullscreen View -->
  <div id="fullscreenView">
    <button onclick="showMainMenu()">Back to Menu</button>
    <button id="fullscreenConnectBtn" onclick="connectWebSocket()">Connect</button>
    <button id="fullscreenDisconnectBtn" onclick="disconnectWebSocket()" style="display:none;">Disconnect</button>
    <img id="fullscreenImage" src="" alt="Fullscreen Stream" />
  </div>

  <script>
    // Input field for the WebSocket server IP
    let ip_input = document.getElementById("ip");

    // Dropdowns for selecting streams
    let selectA = document.getElementById("select-a");
    let selectB = document.getElementById("select-b");
    let selectC = document.getElementById("select-c");

    var ws; // WebSocket connection
    var availableStreams = []; // List of available streams

    function updateConnectionButtons(isConnected) {
      if (isConnected) {
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("disconnectBtn").style.display = "inline-block";
        document.getElementById("fullscreenConnectBtn").style.display = "none";
        document.getElementById("fullscreenDisconnectBtn").style.display = "inline-block";
      } else {
        document.getElementById("connectBtn").style.display = "inline-block";
        document.getElementById("disconnectBtn").style.display = "none";
        document.getElementById("fullscreenConnectBtn").style.display = "inline-block";
        document.getElementById("fullscreenDisconnectBtn").style.display = "none";
      }
    }


    // Function to connect to the WebSocket server
    function connectWebSocket() {
      ws = new WebSocket(`ws://${ip_input.value}:8765`);
      ws.onopen = function () {
        console.log("WebSocket connected");
        updateConnectionButtons(true);
      };
      // Event handler for receiving messages from the server
      ws.onmessage = function (event) {
        let data = JSON.parse(event.data);
        if (data.a) {
          // Update Stream A image
          var imageSrc = "data:image/jpeg;base64," + data.a;
          document.getElementById("colorStream").src = imageSrc;
          document.getElementById("fullscreenImage").src = imageSrc;
        }

        if (data.b) {
          // Update Stream B image
          var imageSrc = "data:image/jpeg;base64," + data.b;
          document.getElementById("depthStream").src = imageSrc;
        }

        if (data.c) {
          // Update Color Adjust image
          var imageSrc = "data:image/jpeg;base64," + data.c;
          document.getElementById("colorAdjustView").src = imageSrc;
        }

        if (data.streams) {
          // Update available streams
          console.log(data.streams);
          availableStreams = data.streams;
          buildSelects();
        }
      };
      
      // Event handler for when the WebSocket connection closes
      ws.onclose = function () {
        console.log("WebSocket connection closed");
        updateConnectionButtons(false);
      };
    }
    
    function disconnectWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
        console.log("WebSocket connection manually closed");
      } else {
        console.log("No active WebSocket connection to close");
      }
    }

    // Function to populate the dropdowns with available streams
    function buildSelects() {
      selectA.innerHTML = "";
      selectB.innerHTML = "";
      selectC.innerHTML = "";
      availableStreams.forEach((stream) => {
        let option = document.createElement("option");
        option.value = stream;
        option.text = stream;
        selectA.appendChild(option);

        let option2 = document.createElement("option");
        option2.value = stream;
        option2.text = stream;
        selectB.appendChild(option2);

        let option3 = document.createElement("option");
        option3.value = stream;
        option3.text = stream;
        selectC.appendChild(option3);
      });
    }

    // Function to send the selected streams to the server
    function selectStream() {
      ws.send(
        JSON.stringify({
          streamA: selectA.value,
          streamB: selectB.value,
          streamC: selectC.value,
        })
      );
    }

    // Function to show the Color Adjust view
    function showcolorAdjust() {
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("colorAdjust").style.display = "block";
    }

    // Function to return to the Main Menu
    function showMainMenu() {
      document.getElementById("fullscreenView").style.display = "none";
      document.getElementById("colorAdjust").style.display = "none";
      document.getElementById("mainMenu").style.display = "block";
    }

    // Function to get RGB values from the Color Adjust image
    function getColorValues(event) {
      const img = document.getElementById("colorAdjustView");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);

      const rect = img.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const rgb = `[${pixel[0]}, ${pixel[1]}, ${pixel[2]}]`;
      const colorInput = document.createElement("input");
      colorInput.type = "text";
      colorInput.value = rgb;
      document.getElementById("colorValues").innerHTML = "RGB Values: ";
      document.getElementById("colorValues").appendChild(colorInput);
    }
    // Function to get gray value from the Color Adjust image
    function getgrayValue(event) {
      const img = document.getElementById("colorAdjustView");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);

      const rect = img.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const rgb = `[${0.299 * pixel[0] + 0.587 * pixel[1] + 0.114 * pixel[2]}]`;
      const colorInput = document.createElement("input");
      colorInput.type = "text";
      colorInput.value = rgb;
      document.getElementById("grayValue").innerHTML = "Gray Value: ";
      document.getElementById("grayValue").appendChild(colorInput);
    }

    // Function to get Hue value from the Color Adjust image
    function getHueValue(event) {
      const img = document.getElementById("colorAdjustView");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);

      const rect = img.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const r = pixel[0] / 255;
      const g = pixel[1] / 255;
      const b = pixel[2] / 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let hue = 0;

      if (max === min) {
        hue = 0; // Achromatic
      } else if (max === r) {
        hue = ((g - b) / (max - min) + (g < b ? 6 : 0)) * 60;
      } else if (max === g) {
        hue = ((b - r) / (max - min) + 2) * 60;
      } else if (max === b) {
        hue = ((r - g) / (max - min) + 4) * 60;
      }

      hue = Math.round(hue);

      const hueInput = document.createElement("input");
      hueInput.type = "text";
      hueInput.value = hue;
      document.getElementById("hueValue").innerHTML = "Hue Value: ";
      document.getElementById("hueValue").appendChild(hueInput);
    }

    // Function to get HSV values from the Color Adjust image
    function getHSVValues(event) {
      const img = document.getElementById("colorAdjustView");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);

      const rect = img.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const r = pixel[0] / 255; // Normalize to [0, 1]
      const g = pixel[1] / 255; // Normalize to [0, 1]
      const b = pixel[2] / 255; // Normalize to [0, 1]

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      // Calculate Hue
      let hue = 0;
      if (delta === 0) {
        hue = 0; // Achromatic
      } else if (max === r) {
        hue = ((g - b) / delta + (g < b ? 6 : 0)) * 60;
      } else if (max === g) {
        hue = ((b - r) / delta + 2) * 60;
      } else if (max === b) {
        hue = ((r - g) / delta + 4) * 60;
      }
      hue = Math.round(hue); // Hue is in degrees (0–360)

      // Calculate Saturation
      const saturation = max === 0 ? 0 : (delta / max) * 100; // Saturation as a percentage (0–100)

      // Calculate Value
      const value = max * 100; // Value as a percentage (0–100)
      
      // round the values to the nearest integer
      const scaledHue = Math.round(hue);
      const scaledSaturation = Math.round(saturation);
      const scaledValue = Math.round(value);

      // Display HSV values
      const hsv = `H: ${scaledHue}, S: ${scaledSaturation}%, V: ${scaledValue}%`;
      document.getElementById("hueValue").innerHTML = `HSV Values: ${hsv}`;
    }

    // Function to show Stream A in fullscreen
    function showFullscreen() {
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("fullscreenView").style.display = "block";
    }

    // Function to update the GRAY value dynamically
    function updateGrayValue(value) {
      // Update the displayed GRAY value
      document.getElementById("grayValueDisplay").innerText = value;

      // Send the updated GRAY value to the server via WebSocket
      ws.send(
        JSON.stringify({
          updateGray: parseInt(value),
        })
      );
    }

    // Automatically connect to the WebSocket server on page load
    window.onload = function () {
      connectWebSocket();
    };
  </script>
</body>

</html>
